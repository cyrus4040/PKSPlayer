name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Read app version
        id: ver
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: gradle assembleDebug --stacktrace
      - name: Name the APK with app name + version
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/PKSPlayer-v${{ steps.ver.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PKSPlayer-v${{ steps.ver.outputs.version }}
          path: dist/PKSPlayer-v${{ steps.ver.outputs.version }}.apk
